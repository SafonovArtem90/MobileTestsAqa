junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
# Без strategy=fixed параметр parallelism игнорируется и потоков столько, сколько ядер процессора.
# Число потоков переопределяется из Gradle: -Pthreads=N или переменная окружения THREADS.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=1
