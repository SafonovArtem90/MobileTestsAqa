# Значения по умолчанию. Любой ключ можно переопределить:
#   -Dключ=значение                     (например, -Ddevices.udids=emulator-5554)
#   переменной окружения КЛЮЧ_В_ВЕРХНЕМ_РЕГИСТРЕ (например, DEVICES_UDIDS=emulator-5554)
#   файлом config-{ENV}.properties       (ENV=local по умолчанию, ENV=ci в CI)
# Секреты (логин, пароль) здесь не хранятся: только переменные окружения или config-local.properties.

appium.server.autoRun=true
appium.server.ip=127.0.0.1
appium.server.port=4723
appium.server.logLevel=error
appium.newCommandTimeout=120

devices.udids=emulator-5554
devices.systemPort.start=8200
devices.wait.timeout=300

platform.name=Android

app.package=com.alfabank.qapp
# Путь к APK внутри src/test/resources. Используется, только если приложение не установлено
# на устройстве и не задан путь через -Dapp.path или переменную окружения APP_PATH.
app.resource=apps/app-debug.apk
app.resetBeforeTest=true

explicit.wait=7
