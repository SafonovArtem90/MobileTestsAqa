name: Android UI tests

on:
  # Ручной запуск: Actions → Android UI tests → Run workflow
  workflow_dispatch:
    inputs:
      include_tags:
        description: "Теги JUnit через запятую (пусто — все тесты)"
        required: false
        default: ""
      branch:
        description: "Ветка для запуска (например, refactoring)"
        required: true
        default: "refactoring"

  # Запуск тестов при создании/переоткрытии PR в master.
  # Типы opened/reopened, без synchronize — последующие пуши в PR не запускают тесты.
  pull_request:
    types: [ opened, reopened ]
    branches: [ master ]

concurrency:
  group: android-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_DOWNLOAD_URL: ${{ secrets.APP_DOWNLOAD_URL }}
      TEST_USER_LOGIN: ${{ secrets.TEST_USER_LOGIN }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      INCLUDE_TAGS: ${{ github.event.inputs.include_tags }}

    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      # Эмулятору в Docker нужен доступ к /dev/kvm
      - name: Включение KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Необязательно: если APK не хранится в репозитории, задайте секрет APP_DOWNLOAD_URL
      - name: Загрузка APK
        if: env.APP_DOWNLOAD_URL != ''
        run: |
          mkdir -p src/test/resources/apps
          curl -fsSL -o src/test/resources/apps/app-debug.apk "$APP_DOWNLOAD_URL"

      - name: Запуск тестов в Docker
        run: docker compose up --build --exit-code-from tests --abort-on-container-exit

      - name: Логи эмулятора при падении
        if: failure()
        run: docker compose logs emulator --tail 200

      - name: Остановка контейнеров
        if: always()
        run: docker compose down -v

      - name: Установка JDK для отчёта Allure
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Подготовка истории прогонов
        if: always()
        run: |
          mkdir -p build/allure-results
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git rev-parse --verify refs/remotes/origin/gh-pages >/dev/null 2>&1; then
            git archive refs/remotes/origin/gh-pages history | tar -x -C build/allure-results || true
          fi

      - name: Генерация отчёта Allure
        if: always()
        run: |
          mkdir -p build
          sudo chown -R "$(id -u):$(id -g)" build
          ./gradlew allureReport --no-daemon

      - name: Сохранение отчёта Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport
          retention-days: 14

      - name: Публикация отчёта Allure на GitHub Pages
        if: hashFiles('build/reports/allure-report/allureReport/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/reports/allure-report/allureReport
          publish_branch: gh-pages

      - name: Ссылка на отчёт
        if: always()
        run: |
          echo "## Отчёт Allure" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Pages: https://safonovartem90.github.io/MobileTestsAqa/" >> $GITHUB_STEP_SUMMARY
          echo "- Артефакт zip: [allure-report](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)" >> $GITHUB_STEP_SUMMARY
